<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Unit Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Accessibility and Visual Hierarchy Enhancements */
        body {
            line-height: 1.6;
            color: #333;
        }
        .focus-visible:focus {
            outline: 3px solid #4299e1;
            outline-offset: 2px;
        }
        /* Mobile-First Responsive Design */
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto px-4 py-8">
        <!-- Login Section -->
        <section id="login-section" class="max-w-md mx-auto">
            <h1 class="text-2xl font-bold mb-6 text-center">Storage Unit Management</h1>
            <form id="login-form" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
                <div class="mb-4">
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">
                        Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        required 
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        aria-describedby="username-help"
                    >
                    <p id="username-help" class="text-xs text-gray-600 mt-1">Enter your registered email</p>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
                        aria-describedby="password-help"
                    >
                    <p id="password-help" class="text-xs text-gray-600 mt-1">Minimum 8 characters</p>
                </div>
                <div class="flex items-center justify-between">
                    <button 
                        type="submit" 
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                    >
                        Sign In
                    </button>
                </div>
            </form>
            <div id="error-message" class="text-red-500 text-center" aria-live="polite"></div>
        </section>

        <!-- Units Listing Section (Hidden by Default) -->
        <section id="units-section" class="hidden">
            <h2 class="text-xl font-semibold mb-4">Available Storage Units</h2>
            <div id="units-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Units will be dynamically populated here -->
            </div>
        </section>

        <!-- Unit Booking Modal (Hidden by Default) -->
        <div id="booking-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
            <div class="bg-white p-6 rounded-lg shadow-xl w-96">
                <h3 class="text-lg font-bold mb-4">Book Storage Unit</h3>
                <form id="booking-form">
                    <div class="mb-4">
                        <label for="duration" class="block text-gray-700 text-sm font-bold mb-2">
                            Rental Duration
                        </label>
                        <select 
                            id="duration" 
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        >
                            <option value="1month">1 Month</option>
                            <option value="3months">3 Months</option>
                            <option value="6months">6 Months</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="billing-option" class="block text-gray-700 text-sm font-bold mb-2">
                            Billing Option
                        </label>
                        <select 
                            id="billing-option" 
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        >
                            <option value="monthly">Monthly</option>
                            <option value="upfront">Upfront</option>
                        </select>
                    </div>
                    <div class="flex justify-between">
                        <button 
                            type="submit" 
                            class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        >
                            Confirm Booking
                        </button>
                        <button 
                            type="button" 
                            id="cancel-booking" 
                            class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Separate Concerns: API Service
        class APIService {
            
            constructor(baseURL, token) {
                this.baseURL = baseURL;
                this.token = token;
            }

            async login(username, password) {
                const clientId = '1560lns5rp8b2rvh3srh6icllb'; // Replace with your Cognito App Client ID
                const region = 'eu-west-1'; // Replace with your AWS region
                const requestPayload = {
                    AuthFlow: 'USER_PASSWORD_AUTH',
                    ClientId: clientId,
                    AuthParameters: {
                        USERNAME: username,
                        PASSWORD: password
                    }
                };

                try {
                    const response = await fetch(`https://cognito-idp.${region}.amazonaws.com/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-amz-json-1.1',
                            'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth'
                        },
                        body: JSON.stringify(requestPayload)
                    });

                    if (!response.ok) {
                        throw new Error('Login failed');
                    }

                    const data = await response.json();
                    const idToken = data.AuthenticationResult.IdToken;

                    sessionStorage.setItem('idToken', idToken);
            
                    return idToken;
                } catch (error) {
                    throw error;
                }
            }

            async fetchAvailableUnits() {
                try {
                    const response = await fetch(`${this.baseURL}/units?status=Available&page=1&limit=10`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Failed to fetch units');
                    }

                    return await response.json();
                } catch (error) {
                    console.error('Login error:', error);
                    alert('Login failed. Please try again.');
                    throw error;
                }
            }

            async bookUnit(unitId, duration, billingOption) {
                try {
                    const response = await fetch(`${this.baseURL}/book-unit`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${this.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            unit_id: unitId, 
                            duration, 
                            billingOption 
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Booking failed');
                    }

                    return await response.json();
                } catch (error) {
                    throw error;
                }
            }
        }

        // Separate Concerns: UI Controller
        class UIController {
            constructor() {
                this.loginSection = document.getElementById('login-section');
                this.unitsSection = document.getElementById('units-section');
                this.unitsGrid = document.getElementById('units-grid');
                this.bookingModal = document.getElementById('booking-modal');
                this.errorMessage = document.getElementById('error-message');

                this.setupEventListeners();
            }

            setupEventListeners() {
                document.getElementById('login-form').addEventListener('submit', this.handleLogin.bind(this));
                document.getElementById('cancel-booking').addEventListener('click', this.hideBookingModal.bind(this));
                
                // Delegated event listener for booking buttons
                this.unitsGrid.addEventListener('click', (event) => {
                    const bookButton = event.target.closest('.book-unit-btn');
                    if (bookButton) {
                        const unitId = bookButton.getAttribute('data-unit-id');
                        this.showBookingModal(unitId);
                    }
                });

                document.getElementById('booking-form').addEventListener('submit', this.handleUnitBooking.bind(this));
            }

            showErrorMessage(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.setAttribute('role', 'alert');
            }

            clearErrorMessage() {
                this.errorMessage.textContent = '';
                this.errorMessage.removeAttribute('role');
            }

            async handleLogin(event) {
                event.preventDefault();
                this.clearErrorMessage();

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const token = await apiService.login(username, password);
                    localStorage.setItem('authToken', token);
                    this.showUnitsSection();
                    await this.loadAvailableUnits();
                } catch (error) {
                    this.showErrorMessage('Login failed. Please check your credentials.');
                }
            }

            async loadAvailableUnits() {
                try {
                    const units = await apiService.fetchAvailableUnits();
                    this.renderUnits(units);
                } catch (error) {
                    this.showErrorMessage('Failed to load units. Please try again.');
                }
            }

            renderUnits(units) {
                this.unitsGrid.innerHTML = units.map(unit => `
                    <div class="bg-white rounded-lg shadow-md p-4">
                        <img src="${unit.imgUrl}" alt="Storage Unit" class="w-full h-48 object-cover rounded-md mb-4">
                        <h3 class="text-lg font-semibold mb-2">${unit.location}</h3>
                        <p class="text-gray-600 mb-2">Size: ${unit.size}</p>
                        <button 
                            data-unit-id="${unit.id}" 
                            class="book-unit-btn bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        >
                            Book Unit
                        </button>
                    </div>
                `).join('');
            }

            showUnitsSection() {
                this.loginSection.classList.add('hidden');
                this.unitsSection.classList.remove('hidden');
            }

            showBookingModal(unitId) {
                this.selectedUnitId = unitId;
                this.bookingModal.classList.remove('hidden');
            }

            hideBookingModal() {
                this.bookingModal.classList.add('hidden');
                this.selectedUnitId = null;
            }

            async handleUnitBooking(event) {
                event.preventDefault();

                const duration = document.getElementById('duration').value;
                const billingOption = document.getElementById('billing-option').value;

                try {
                    await apiService.bookUnit(this.selectedUnitId, duration, billingOption);
                    alert('Unit booked successfully!');
                    this.hideBookingModal();
                    await this.loadAvailableUnits();
                } catch (error) {
                    this.showErrorMessage('Booking failed. Please try again.');
                }
            }
        }

        // Application Initialization
        const apiService = new APIService('https://yh2imbp562.execute-api.eu-west-1.amazonaws.com/prod', localStorage.getItem('authToken'));
        const uiController = new UIController();
    </script>
</body>
</html>
