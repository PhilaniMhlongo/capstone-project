<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login for Access Token</title>
    <style>
        /* Basic styling for the login page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <form id="loginForm">
        <h2>Login to Get Token</h2>
        <input type="text" id="username" name="username" placeholder="Enter username" required>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <button type="submit">Login</button>
        <div id="message" class="message"></div>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const clientId = '1560lns5rp8b2rvh3srh6icllb'; // Replace with your Cognito App Client ID
            const region = 'eu-west-1'; // Replace with your AWS region

            const requestPayload = {
                AuthFlow: 'USER_PASSWORD_AUTH',
                ClientId: clientId,
                AuthParameters: {
                    USERNAME: username,
                    PASSWORD: password
                }
            };

            try {
                const response = await fetch(`https://cognito-idp.${region}.amazonaws.com/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-amz-json-1.1',
                        'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth'
                    },
                    body: JSON.stringify(requestPayload)
                });

                if (response.ok) {
                    const data = await response.json();
                    const idToken = data.AuthenticationResult.IdToken;
                    sessionStorage.setItem('idToken', idToken);
                    document.getElementById('message').textContent = 'Login successful! Token stored.';
                    document.getElementById('message').style.color = 'green';
                } else {
                    const error = await response.json();
                    document.getElementById('message').textContent = `Error: ${error.message || 'Failed to login'}`;
                    document.getElementById('message').style.color = 'red';
                }
            } catch (error) {
                document.getElementById('message').textContent = `Network Error: ${error.message}`;
                document.getElementById('message').style.color = 'red';
            }
        });
    </script>
</body>
</html>
