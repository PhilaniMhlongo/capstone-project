openapi: 3.0.1
info:
  title: Self-Storage Rental Management API
  version: 1.0.0
  description: >
    Comprehensive API for managing self-storage unit rentals
    Features:
    - User profile management
    - Unit availability checking
    - Rental lifecycle management
    - Payment integration placeholders
    - Notification preferences

paths:
  # User Profile Endpoints
  /users/profile:
    get:
      summary: Retrieve current user profile
      description: Fetches detailed user profile information
      operationId: getUserProfile
      security:
        - CognitoAuthorizer: []
      responses:
        '200':
          description: Successful profile retrieval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User profile not found
    put:
      summary: Update user profile
      description: Allows users to update their profile information
      operationId: updateUserProfile
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile successfully updated
        '400':
          description: Invalid input

  # Rental Unit Availability Endpoints
  /units/availability:
    get:
      summary: Search for available storage units
      description: >
        Retrieve available storage units based on various filters
        - Size range
        - Location
        - Special features
      operationId: searchAvailableUnits
      parameters:
        - name: min_size
          in: query
          schema:
            type: number
            description: Minimum unit size in square feet
        - name: max_size
          in: query
          schema:
            type: number
            description: Maximum unit size in square feet
        - name: location
          in: query
          schema:
            type: string
            description: Specific location or zip code
        - name: features
          in: query
          schema:
            type: array
            items:
              type: string
              enum: 
                - climate_controlled
                - drive_up_access
                - 24_hour_access
                - security_cameras
                - indoor_units
      responses:
        '200':
          description: List of available units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageUnit'

  # Enhanced Rental Endpoints
  /rentals:
    post:
      summary: Create a new rental reservation
      description: >
        Create a rental reservation with:
        - Unit selection
        - Rental duration
        - Optional insurance
        - Payment method
      operationId: createRental
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalRequest'
      responses:
        '201':
          description: Rental reservation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '400':
          description: Invalid rental request
        '409':
          description: Unit already reserved

    get:
      summary: List user's rental history and active rentals
      description: >
        Retrieve comprehensive rental history
        - Active rentals
        - Past rentals
        - Filtering options
      operationId: listRentals
      security:
        - CognitoAuthorizer: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: 
              - active
              - completed
              - cancelled
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of rentals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalResponse'

  /rentals/{rentalId}:
    get:
      summary: Get specific rental details
      operationId: getRentalDetails
      security:
        - CognitoAuthorizer: []
      parameters:
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rental details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'

    put:
      summary: Modify rental reservation
      description: >
        Update rental details:
        - Change unit
        - Adjust rental duration
        - Add/remove services
      operationId: updateRental
      security:
        - CognitoAuthorizer: []
      parameters:
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalUpdateRequest'
      responses:
        '200':
          description: Rental successfully updated
        '400':
          description: Invalid update request

    delete:
      summary: Cancel rental reservation
      description: Cancel an existing rental with optional reason
      operationId: cancelRental
      security:
        - CognitoAuthorizer: []
      parameters:
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancellationReason:
                  type: string
      responses:
        '204':
          description: Rental successfully cancelled
        '400':
          description: Cannot cancel rental

  # Payment Integration Placeholder
  /payments:
    post:
      summary: Process rental payment
      description: >
        Handle payments for:
        - New rentals
        - Rental extensions
        - Additional services
      operationId: processPayment
      security:
        - CognitoAuthorizer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
        '402':
          description: Payment failed

components:
  schemas:
    UserProfile:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
        preferredContactMethod:
          type: string
          enum: [email, phone, sms]

    UserProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
        phoneNumber:
          type: string
        preferredContactMethod:
          type: string
          enum: [email, phone, sms]

    StorageUnit:
      type: object
      properties:
        unitId:
          type: string
        size:
          type: number
        price:
          type: number
        features:
          type: array
          items:
            type: string
        availability:
          type: string
          enum: [available, reserved, maintenance]

    RentalRequest:
      type: object
      required:
        - unitId
        - startDate
        - endDate
      properties:
        unitId:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        insurance:
          type: boolean
        additionalServices:
          type: array
          items:
            type: string

    RentalResponse:
      type: object
      properties:
        rentalId:
          type: string
        unitId:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [reserved, active, completed, cancelled]
        totalCost:
          type: number

    RentalUpdateRequest:
      type: object
      properties:
        unitId:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        additionalServices:
          type: array
          items:
            type: string

    PaymentRequest:
      type: object
      required:
        - amount
        - paymentMethod
      properties:
        amount:
          type: number
        paymentMethod:
          type: string
          enum: [credit_card, debit_card, bank_transfer]
        rentalId:
          type: string

  securitySchemes:
    CognitoAuthorizer:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://your-domain.auth.region.amazoncognito.com/oauth2/authorize
          tokenUrl: https://your-domain.auth.region.amazoncognito.com/oauth2/token
          scopes:
            openid: OpenID Connect authorization
            email: Email access
            profile: User profile information

# API Gateway Request Validators
x-amazon-apigateway-request-validators:
  validate-body:
    validateRequestParameters: false
    validateRequestBody: true
