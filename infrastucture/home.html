<!DOCTYPE html>
<html>
<head>
    <title>Advanced Storage Management System</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 800px; 
            margin: auto; 
            padding: 20px;
        }
        .unit-card { 
            border: 1px solid #ddd; 
            margin: 10px; 
            padding: 10px; 
            position: relative;
        }
        #status { color: blue; }
        #error { color: red; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Storage Management Dashboard</h1>
    <div id="status"></div>
    <div id="unitList"></div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Book Storage Unit</h2>
            <form id="bookingForm">
                <label for="bookingDays">Number of Months:</label>
                <input type="number" id="bookingDays" min="1" max="12" required>
                <div id="discountInfo"></div>
                <button type="submit">Confirm Booking</button>
            </form>
        </div>
    </div>

    <!-- Share Access Modal -->
    <div id="shareAccessModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Share Unit Access</h2>
            <form id="shareAccessForm">
                <label for="sharedEmail">Email Address:</label>
                <input type="email" id="sharedEmail" required>
                <button type="submit">Share Access</button>
            </form>
        </div>
    </div>

    <script>
        class StorageManagementAPI {
            static units = [
                { unit_id: 'UNIT-001', facility_id: 'FAC-A', status: 'Available', size_sq_ft: 50, monthly_rate: 75 },
                { unit_id: 'UNIT-002', facility_id: 'FAC-B', status: 'Available', size_sq_ft: 100, monthly_rate: 125 },
                { unit_id: 'UNIT-003', facility_id: 'FAC-A', status: 'Reserved', size_sq_ft: 200, monthly_rate: 200 }
            ];

            static async listUnits(filters = {}) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({ 
                            units: this.units.filter(unit => 
                                (!filters.facilityId || unit.facility_id === filters.facilityId) &&
                                (!filters.minSize || unit.size_sq_ft >= filters.minSize) &&
                                (!filters.maxSize || unit.size_sq_ft <= filters.maxSize) &&
                                (!filters.status || unit.status === filters.status)
                            )
                        });
                    }, 500);
                });
            }

            static async bookUnit(unitId, months) {
                return new Promise((resolve, reject) => {
                    const unitIndex = this.units.findIndex(u => u.unit_id === unitId);
                    if (unitIndex === -1) {
                        reject(new Error('Unit not found'));
                        return;
                    }

                    // Calculate discount
                    let discountPercentage = 0;
                    if (months >= 6) {
                        discountPercentage = months >= 12 ? 20 : 10;
                    }

                    const originalRate = this.units[unitIndex].monthly_rate;
                    const totalCost = originalRate * months * (1 - discountPercentage/100);

                    // Update unit status
                    this.units[unitIndex].status = 'Booked';

                    setTimeout(() => {
                        resolve({
                            rental_id: `RENTAL-${Math.random().toString(36).substr(2, 9)}`,
                            unit_id: unitId,
                            months: months,
                            original_total: originalRate * months,
                            total_cost: totalCost,
                            discount_percentage: discountPercentage
                        });
                    }, 800);
                });
            }

            static async shareUnitAccess(rentalId, email) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({
                            message: `Access shared for rental ${rentalId} to ${email}`,
                            shared_email: email
                        });
                    }, 400);
                });
            }
        }

        let currentUnitId = null;

        async function initializeApp() {
            const unitList = document.getElementById('unitList');
            const statusMessage = document.getElementById('status');

            try {
                const { units } = await StorageManagementAPI.listUnits();
                unitList.innerHTML = units.map(unit => `
                    <div class="unit-card" id="unit-${unit.unit_id}">
                        <h3>Unit: ${unit.unit_id}</h3>
                        <p>Size: ${unit.size_sq_ft} sq ft</p>
                        <p>Monthly Rate: $${unit.monthly_rate}</p>
                        <p id="status-${unit.unit_id}">Status: ${unit.status}</p>
                        <div>
                            <button onclick="openBookingModal('${unit.unit_id}')">Book Unit</button>
                            <button onclick="shareAccessModal('${unit.unit_id}')">Share Access</button>
                        </div>
                    </div>
                `).join('');

                setupModalHandlers();
            } catch (error) {
                statusMessage.textContent = `Error: ${error.message}`;
            }
        }

        function setupModalHandlers() {
            const bookingModal = document.getElementById('bookingModal');
            const shareAccessModal = document.getElementById('shareAccessModal');
            const closeButtons = document.getElementsByClassName('close');

            // Close modal when clicking (x)
            for (let closeBtn of closeButtons) {
                closeBtn.onclick = function() {
                    bookingModal.style.display = 'none';
                    shareAccessModal.style.display = 'none';
                }
            }

            // Booking form submission
            const bookingForm = document.getElementById('bookingForm');
            bookingForm.onsubmit = async function(e) {
                e.preventDefault();
                const months = document.getElementById('bookingDays').value;
                
                try {
                    const result = await StorageManagementAPI.bookUnit(currentUnitId, parseInt(months));
                    
                    // Update status
                    document.getElementById(`status-${currentUnitId}`).textContent = `Status: Booked`;
                    
                    // Show booking details
                    const statusMessage = document.getElementById('status');
                    statusMessage.textContent = `Booked Unit ${currentUnitId} for ${months} months. 
                        Original Total: $${result.original_total.toFixed(2)}
                        Discount: ${result.discount_percentage}%
                        Final Total: $${result.total_cost.toFixed(2)}`;
                    
                    bookingModal.style.display = 'none';
                } catch (error) {
                    alert(`Booking Failed: ${error.message}`);
                }
            };

            // Share access form submission
            const shareAccessForm = document.getElementById('shareAccessForm');
            shareAccessForm.onsubmit = async function(e) {
                e.preventDefault();
                const email = document.getElementById('sharedEmail').value;
                
                try {
                    const result = await StorageManagementAPI.shareUnitAccess(
                        `RENTAL-${currentUnitId}`, 
                        email
                    );
                    
                    const statusMessage = document.getElementById('status');
                    statusMessage.textContent = result.message;
                    
                    shareAccessModal.style.display = 'none';
                } catch (error) {
                    alert(`Share Access Failed: ${error.message}`);
                }
            };

            // Booking days input handler for discount
            const bookingDays = document.getElementById('bookingDays');
            const discountInfo = document.getElementById('discountInfo');
            bookingDays.oninput = function() {
                const months = parseInt(this.value);
                let discountMessage = '';
                
                if (months >= 12) {
                    discountMessage = '20% discount applied for booking 12+ months!';
                } else if (months >= 6) {
                    discountMessage = '10% discount applied for booking 6-11 months!';
                }
                
                discountInfo.textContent = discountMessage;
            };
        }

        function openBookingModal(unitId) {
            currentUnitId = unitId;
            const bookingModal = document.getElementById('bookingModal');
            bookingModal.style.display = 'block';
        }

        function shareAccessModal(unitId) {
            currentUnitId = unitId;
            const shareAccessModal = document.getElementById('shareAccessModal');
            shareAccessModal.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
