AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Self-Storage Solution Serverless Backend-Data store

  '
Globals:
  Function:
    Runtime: python3.9
    MemorySize: 128
    Timeout: 100
    Tracing: Active
Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Users
      AttributeDefinitions:
      - AttributeName: userid
        AttributeType: S
      KeySchema:
      - AttributeName: userid
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api/users.lambda_handler
      Description: Handler for all users related operations
      Environment:
        Variables:
          USERS_TABLE:
            Ref: UsersTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UsersTable
      Tags:
        Stack:
          Fn::Sub: ${AWS::StackName}
      CodeUri: UsersFunction
    Metadata:
      SamResourceId: UsersFunction
Outputs:
  UsersTable:
    Description: DynamoDB Users table
    Value:
      Ref: UsersTable
  UsersFunction:
    Description: Lambda function used to perform actions on the users data
    Value:
      Ref: UsersFunction
