AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Serverless Self-Storage Solution - Rental Service

  '
Globals:
  Api:
    TracingEnabled: true
Parameters:
  UserPool:
    Type: String
    Description: User Pool ID produced by the Users module
Resources:
  RentalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-Rentals
      AttributeDefinitions:
      - AttributeName: facilityId
        AttributeType: S
      - AttributeName: unitId
        AttributeType: S
      KeySchema:
      - AttributeName: facilityId
        KeyType: HASH
      - AttributeName: unitId
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
  RentalsAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: Module3CognitoAuthorizer
        Authorizers:
          Module3CognitoAuthorizer:
            UserPoolArn:
              Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
  CreateRentalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateRentalFunction
      Handler: book.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RentalsTable
      Environment:
        Variables:
          TABLE_NAME:
            Ref: RentalsTable
      Events:
        BookUnit:
          Type: Api
          Properties:
            Path: /rentals/book
            Method: post
            RestApiId:
              Ref: RentalsAPI
    Metadata:
      SamResourceId: CreateRentalFunction
Outputs:
  RentalServiceEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${RentalsAPI}.execute-api.${AWS::Region}.amazonaws.com/Prod
  RentalsTable:
    Description: DynamoDb Rentals Table
    Value:
      Ref: RentalsTable
