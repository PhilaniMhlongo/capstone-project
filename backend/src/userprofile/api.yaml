openapi: 3.0.1
info:
  title: rentals-service
  version: 2022-07-12T06:04:43Z
paths:
  /rentals:
    get:
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListUserRentFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"
    post:
      summary: Create a new rental.
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalInputModel"
      responses:
        "201":
          description: Successfully created the rental.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-request-validator: ValidateBody
      x-amazon-apigateway-integration:
        credentials:
          Fn::Sub: ${ApiGatewayEventBridgeRole.Arn}
        httpMethod: POST
        uri: arn:aws:apigateway:${AWS::Region}:events:action/PutEvents
        passthroughBehavior: when_no_templates
        type: aws
        requestTemplates:
          application/json:
            Fn::Sub: >
              #set($context.requestOverride.header.X-Amz-Target = "AWSEvents.PutEvents")
              #set($context.requestOverride.header.Content-Type = "application/x-amz-json-1.1")
              {
                "Entries": [
                  {
                    "Detail": "{\"unitId\": \"$input.path('$.unitId')\", \"customerId\": \"$input.path('$.customerId')\", \"rentalStatus\": \"$input.path('$.rentalStatus')\", \"startDate\": \"$input.path('$.startDate')\", \"userId\": \"$context.authorizer.claims.sub\"}",
                    "DetailType": "rental.created",
                    "EventBusName": "${UnitBus.Name}",
                    "Source": "rentals-service"
                  }
                ]
              }
        responses:
          default:
            statusCode: "201"
            responseTemplates:
              application/json: "{}"

  /book-unit:
    post:
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BookStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"
    post:
      summary: Book a storage unit.
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUnitBookingInput"
      responses:
        "201":
          description: Successfully booked the storage unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitBookingResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-request-validator: ValidateBody
      x-amazon-apigateway-integration:
        credentials:
          Fn::Sub: ${ApiGatewayEventBridgeRole.Arn}
        httpMethod: POST
        uri: arn:aws:apigateway:${AWS::Region}:events:action/PutEvents
        passthroughBehavior: when_no_templates
        type: aws
        requestTemplates:
          application/json:
            Fn::Sub: >
              #set($context.requestOverride.header.X-Amz-Target = "AWSEvents.PutEvents")
              #set($context.requestOverride.header.Content-Type = "application/x-amz-json-1.1")
              {
                "Entries": [
                  {
                    "Detail": "{\"unitId\": \"$input.path('$.unit_id')\", \"customerId\": \"$context.authorizer.claims.sub\", \"duration\": \"$input.path('$.duration')\", \"billingOption\": \"$input.path('$.billingOption')\", \"startDate\": \"$input.path('$.start_date')\"}", 
                    "DetailType": "storage.unit.booked",
                    "EventBusName": "${UnitBus.Name}",
                    "Source": "storage-service"
                  }
                ]
              }
        responses:
          default:
            statusCode: "201"
            responseTemplates:
              application/json: "{}"

  /rentals/{rentalId}:
    get:
      summary: Retrieve rental details by rental ID.
      parameters:
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Successfully retrieved the rental details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        credentials:
          Fn::Sub: "${ApiGatewayEventBridgeRole.Arn}"
        httpMethod: POST
        uri: "arn:aws:apigateway:${AWS::Region}:events:action/PutEvents"
        passthroughBehavior: when_no_templates
        type: aws
        requestTemplates:
          application/json:
            Fn::Sub: >
              {
                "TableName": "RentalsTable",
                "Key": {
                  "RentalId": {"S": "$input.params('rentalId')"}
                }
              }
        responses:
          default:
            statusCode: "200"
            responseTemplates:
              application/json: "$input.path('$.Item')"

  /rentals/{rentalId}/status:
    put:
      summary: Update the status of a rental.
      parameters:
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalStatusUpdateModel"
      responses:
        "200":
          description: Successfully updated the rental status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        credentials:
          Fn::Sub: ${ApiGatewayEventBridgeRole.Arn}
        httpMethod: POST
        uri: arn:aws:apigateway:${AWS::Region}:events:action/PutEvents
        passthroughBehavior: when_no_templates
        type: aws
        requestTemplates:
          application/json:
            Fn::Sub: >
              #set($context.requestOverride.header.X-Amz-Target = "AWSEvents.PutEvents")
              #set($context.requestOverride.header.Content-Type = "application/x-amz-json-1.1")
              {
                "Entries": [
                  {
                    "Detail": "{\"rentalId\": \"$input.params('rentalId')\", \"rentalStatus\": \"$input.path('$.rentalStatus')\", \"userId\": \"$context.authorizer.claims.sub\"}",
                    "DetailType": "rental.status.updated",
                    "EventBusName": "${UnitBus.Name}",
                    "Source": "rentals-service"
                  }
                ]
              }
        responses:
          default:
            statusCode: "200"
            responseTemplates:
              application/json: "{}"

  /units/{unitId}/status:
    put:
      summary: Update storage unit status (for support staff)
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Available, Unavailable, Reserved, Cancelling, Problem]
      responses:
        "200":
          description: Successfully updated unit status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitStatusUpdateResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManageStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"

  /units/{unitId}/share:
    post:
      summary: Share storage unit access with another user
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - shared_user_id
              properties:
                shared_user_id:
                  type: string
                  description: User ID to share access with
                start_date:
                  type: string
                  format: date-time
                  description: Optional start date for shared access
                end_date:
                  type: string
                  format: date-time
                  description: Optional end date for shared access
      responses:
        "200":
          description: Successfully shared unit access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitAccessShareResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManageStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"

  /units/{unitId}/access:
    post:
      summary: Log access to a storage unit
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_id
              properties:
                unit_id:
                  type: string
                  description: Identifier of the storage unit being accessed
      responses:
        "200":
          description: Successfully logged unit access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitAccessLogResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManageStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"

components:
  schemas:
    UnitStatusUpdateResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message for status update
        
    UnitAccessShareResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message for access sharing
        
    UnitAccessLogResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message for access logging
          
    StorageUnitBookingInput:
      type: object
      required:
        - unit_id
        - duration
        - billingOption
      properties:
        unit_id:
          type: string
          description: Unique identifier of the storage unit
        duration:
          type: string
          enum: 
            - 1day
            - 1month
            - 6months
            - 1year
            - indefinite
          default: indefinite
          description: Rental duration
        billingOption:
          type: string
          enum: 
            - monthly
            - quarterly
            - yearly
          default: monthly
          description: Billing frequency

    StorageUnitBookingResponse:
      type: object
      properties:
        rental_id:
          type: string
          description: Unique identifier for the rental
        unit_id:
          type: string
          description: Identifier of the booked storage unit

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Description of the error
   
    RentalInputModel:
      type: object
      required:
        - unitId
        - customerId
        - rentalStatus
        - startDate
      properties:
        unitId:
          type: string
        customerId:
          type: string
        rentalStatus:
          type: string
          enum: [Available, Reserved, Cancelling, Problem, Unavailable]
        startDate:
          type: string
          format: date-time
    RentalStatusUpdateModel:
      type: object
      required:
        - rentalStatus
      properties:
        rentalStatus:
          type: string
          enum: [Available, Reserved, Cancelling, Problem, Unavailable]
    RentalResponse:
      type: object
      properties:
        rentalId:
          type: string
        unitId:
          type: string
        customerId:
          type: string
        rentalStatus:
          type: string
        startDate:
          type: string
          format: date-time
    Empty:
      type: object
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        providerARNs:
          - Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
        type: cognito_user_pools

x-amazon-apigateway-request-validators:
  ValidateBody:
    validateRequestParameters: false
    validateRequestBody: true
