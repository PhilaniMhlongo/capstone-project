components:
  schemas:
    RentalEventModel:
      type: object
      required:
        - event_type
        - detail
      properties:
        event_type:
          type: string
          enum: 
            - rental.booking.requested
            - rental.booking.confirmed
            - rental.booking.failed
          description: Type of rental event
        detail:
          type: object
          properties:
            rental_id:
              type: string
              description: Unique identifier for the rental
            unit_id:
              type: string
              description: Identifier of the storage unit
            user_id:
              type: string
              description: User who initiated the rental
            booking_date:
              type: string
              format: date-time
              description: Timestamp of booking request
            status:
              type: string
              enum: 
                - PENDING
                - CONFIRMED
                - FAILED
              description: Current status of the rental event
              
    StorageUnitCreateModel:
      type: object
      required:
        - location
        - size
        - imgUrl
        - availabilityStatus
      properties:
        location:
          type: string
          description: Location of the storage unit
          example: "Building A, Floor 2, Unit 203"
        size:
          type: string
          description: Size of the storage unit
          enum: 
            - Small
            - Medium
            - Large
            - Extra Large
        imgUrl:
          type: string
          description: URL of the storage unit image
          format: uri
        availabilityStatus:
          type: string
          description: Current availability status of the unit
          enum: 
            - Available
            - Unavailable
            - Reserved
    
    StorageUnitResponse:
      type: object
      properties:
        unit_id:
          type: string
          description: Unique identifier for the storage unit
        location:
          type: string
          description: Location of the storage unit
        size:
          type: string
          description: Size of the storage unit
        imgUrl:
          type: string
          description: URL of the storage unit image
        availabilityStatus:
          type: string
          description: Current availability status of the unit

    UnitStatusUpdateResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message for status update
        
    UnitAccessShareResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message for access sharing
        
    UnitAccessLogResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message for access logging
          
    StorageUnitBookingInput:
      type: object
      required:
        - unit_id
        - duration
        - billingOption
      properties:
        unit_id:
          type: string
          description: Unique identifier of the storage unit
        duration:
          type: string
          enum: 
            - 1day
            - 1month
            - 6months
            - 1year
            - indefinite
          default: indefinite
          description: Rental duration
        billingOption:
          type: string
          enum: 
            - monthly
            - quarterly
            - yearly
          default: monthly
          description: Billing frequency

    StorageUnitBookingResponse:
      type: object
      properties:
        rental_id:
          type: string
          description: Unique identifier for the rental
        unit_id:
          type: string
          description: Identifier of the booked storage unit
    RentalEventErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Detailed error message
        rental_id:
          type: string
          description: Rental identifier if available
        event_type:
          type: string
          description: Type of event that failed
          
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Description of the error
   
  
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        providerARNs:
          - Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
        type: cognito_user_pools

x-amazon-apigateway-request-validators:
  ValidateBody:
    validateRequestParameters: false
    validateRequestBody: true
