openapi: 3.0.1
info:
  title: rentals-service
  version: 2022-07-12T06:04:43Z
x-amazon-apigateway-cors:
  allow-origin: "'*'"
  allow-methods: "'GET, POST, OPTIONS'"
  allow-headers: "'Content-Type, Authorization'"
  max-age: 3600
paths:
 
  /units:
    post:
      summary: Create a new storage unit (Admin only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUnitCreateModel"
      responses:
        "201":
          description: Successfully created the storage unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitResponse"
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"
    
    get:
      summary: Retrieve list of storage units with advanced filtering and pagination
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Available, Unavailable, Reserved]
            description: Filter units by availability status
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
            description: Page number for paginated results
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            description: Number of units to return per page (1-100)
      responses:
        "200":
          description: Successfully retrieved storage units
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: Unique identifier for the request
                  units:
                    type: array
                    items:
                      $ref: "#/components/schemas/StorageUnitResponse"
                  total:
                    type: integer
                    description: Total number of units returned
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Number of units per page
                  status_filter:
                    type: string
                    description: Applied status filter
                  debug_info:
                    type: object
                    properties:
                      scanned_count:
                        type: integer
                        description: Total number of items scanned
                      last_evaluated_key:
                        type: object
                        description: Pagination token for subsequent requests
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  request_id:
                    type: string
                  details:
                    type: string
        "500":
          description: Server-side error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  request_id:
                    type: string
                  details:
                    type: string
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListStorageUnitsFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"


  /book-unit:
    post:
      summary: Book a storage unit.
      parameters:
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUnitBookingInput"
      responses:
        "201":
          description: Successfully booked the storage unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUnitBookingResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BookStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"
        


  /units/{unitId}/status:
    put:
      summary: Update storage unit status (for support staff)
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Available, Unavailable, Reserved, Cancelling, Problem]
      responses:
        "200":
          description: Successfully updated unit status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitStatusUpdateResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManageStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"

  /units/{unitId}/share:
    post:
      summary: Share storage unit access with another user
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - shared_user_id
              properties:
                shared_user_id:
                  type: string
                  description: User ID to share access with
                start_date:
                  type: string
                  format: date-time
                  description: Optional start date for shared access
                end_date:
                  type: string
                  format: date-time
                  description: Optional end date for shared access
      responses:
        "200":
          description: Successfully shared unit access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitAccessShareResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManageStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"

  /units/{unitId}/access:
    post:
      summary: Log access to a storage unit
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: X-Amz-Target
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - unit_id
              properties:
                unit_id:
                  type: string
                  description: Identifier of the storage unit being accessed
      responses:
        "200":
          description: Successfully logged unit access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitAccessLogResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManageStorageUnitFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"

  /payment-method:
    post:
      summary: Add or update customer payment method
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum: [card, eft]
                  default: card
                  description: Type of payment method
                last_four_digits:
                  type: string
                  description: Last four digits of the payment card
      responses:
        "200":
          description: Successfully added payment method
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server-side error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CognitoAuthorizer: []
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri: 
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PaymentManagementFunction.Arn}/invocations'
        passthroughBehavior: "when_no_match"
        type: "aws_proxy"

