AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Self-Storage Solution Serverless Backend Asynchronous Pattern with EventBridge and SQS

Parameters:
  UserPool:
    Type: String
    Description: User Pool
  Service:
    Type: String
    Default: userprofile
  Stage:
    Type: String
    Default: prod

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 20
    Tracing: Active
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPython:20
  Api:
    TracingEnabled: true
    

Resources:
  StorageUnitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-StorageUnitsTable
      AttributeDefinitions:
        - AttributeName: "unit_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "unit_id"
          KeyType: "HASH"
      BillingMode: PAY_PER_REQUEST

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-PaymentsTable
      AttributeDefinitions:
        - AttributeName: "user_id"
          AttributeType: "S"
        - AttributeName: "payment_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "user_id"
          KeyType: "HASH"
        - AttributeName: "payment_id"
          KeyType: "RANGE"
      BillingMode: PAY_PER_REQUEST

  RentalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-RentalsTable
      AttributeDefinitions:
        - AttributeName: "rental_id"
          AttributeType: "S"
        - AttributeName: "unit_id"
          AttributeType: "S"
        - AttributeName: "user_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "rental_id"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        - IndexName: UnitIndex
          KeySchema:
            - AttributeName: "unit_id"
              KeyType: "HASH"
          Projection:
            ProjectionType: ALL
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: "user_id"
              KeyType: "HASH"
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  CreateStorageUnitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/rent
      Handler: create_unit.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StorageUnitsTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
      Environment:
        Variables:
          STORAGE_UNITS_TABLE: !Ref StorageUnitsTable
          USER_POOL_ID: !Ref UserPool
      Events:
        CreateStorageUnit:
          Type: Api
          Properties:
            Path: /units
            Method: post
            RestApiId: !Ref ProfileApiGateway
        OptionsCreateStorageUnit:
          Type: Api
          Properties:
            Path: /units
            Method: options
            RestApiId: !Ref ProfileApiGateway

  ListStorageUnitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/rent
      Handler: list_units.lambda_handler
      Runtime: python3.9
      Tracing: Active
      
      Policies:
        DynamoDBReadPolicy:
          TableName: !Ref StorageUnitsTable
      Environment:
        Variables:
          STORAGE_UNITS_TABLE: !Ref StorageUnitsTable
          # Add logging configuration
          POWERTOOLS_SERVICE_NAME: storage-units
          POWERTOOLS_METRICS_NAMESPACE: StorageService
          LOG_LEVEL: INFO
      Events:
        GetStorageUnits:
          Type: Api
          Properties:
            Path: /units
            Method: get
            RestApiId: !Ref ProfileApiGateway
        OptionsStorageUnits:
          Type: Api
          Properties:
            Path: /units
            Method: options
            RestApiId: !Ref ProfileApiGateway
      

  BookStorageUnitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/rent
      Handler: book_storage_unit.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StorageUnitsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RentalsTable
        - Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt RentalEventsQueue.Arn
      Environment:
        Variables:
          STORAGE_UNITS_TABLE: !Ref StorageUnitsTable
          RENTALS_TABLE: !Ref RentalsTable
          RENTAL_EVENTS_QUEUE: !Ref RentalEventsQueue
      Events:
         BookStorageUnit:
          Type: Api
          Properties:
            Path: /book-unit
            Method: post
            RestApiId: !Ref ProfileApiGateway
  # manage storage unit
  AccessLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-AccessLogTable
      AttributeDefinitions:
        - AttributeName: "unit_id"
          AttributeType: "S"
        - AttributeName: "timestamp"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "unit_id"
          KeyType: "HASH"
        - AttributeName: "timestamp"
          KeyType: "RANGE"
      BillingMode: PAY_PER_REQUEST

  PaymentManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/rent  # Assuming the script is in this directory
      Handler: payment_management.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RentalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StorageUnitsTable
      Environment:
        Variables:
          RENTALS_TABLE: !Ref RentalsTable
          PAYMENTS_TABLE: !Ref PaymentsTable
          UNIT_TABLE: !Ref StorageUnitsTable
          POWERTOOLS_SERVICE_NAME: payment-management
          LOG_LEVEL: INFO
      Events:
        ManagePaymentMethod:
          Type: Api
          Properties:
            Path: /payment-method
            Method: post
            RestApiId: !Ref ProfileApiGateway
        ApplyDiscount:
          Type: Api
          Properties:
            Path: /discount
            Method: post
            RestApiId: !Ref ProfileApiGateway
        CancelRental:
          Type: Api
          Properties:
            Path: /cancel-rental
            Method: post
            RestApiId: !Ref ProfileApiGateway
        ProcessRecurringBilling:
          Type: Api
          Properties:
            Path: /process-billing
            Method: post
            RestApiId: !Ref ProfileApiGateway

        PrePayment:
          Type: Api
          Properties:
            Path: /pre-payment
            Method: post
            RestApiId: !Ref ProfileApiGateway

  RecurringBillingScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Monthly trigger for recurring billing
      ScheduleExpression: cron(0 0 1 * ? *)  # First day of each month at midnight
      State: ENABLED
      Targets:
        - Arn: !GetAtt PaymentManagementFunction.Arn
          Id: RecurringBillingTrigger
          Input: '{"httpMethod": "POST", "path": "/process-billing"}'

  RecurringBillingSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PaymentManagementFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RecurringBillingScheduleRule.Arn

  # Add this SNS Topic resource
  UnitAccessNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-UnitAccessNotifications"


  # Add this new Lambda function
  ManageStorageUnitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/rent
      Handler: manage_storage_unit.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StorageUnitsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RentalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AccessLogTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref UnitAccessNotificationTopic
      Environment:
        Variables:
          STORAGE_UNITS_TABLE: !Ref StorageUnitsTable
          RENTALS_TABLE: !Ref RentalsTable
          ACCESS_LOG_TABLE: !Ref AccessLogTable
          UNIT_ACCESS_NOTIFICATION_TOPIC: !Ref UnitAccessNotificationTopic
      Events:
        UpdateUnitStatus:
          Type: Api
          Properties:
            Path: /units/{unitId}/status
            Method: put
            RestApiId: !Ref ProfileApiGateway
        ShareUnitAccess:
          Type: Api
          Properties:
            Path: /units/{unitId}/share
            Method: post
            RestApiId: !Ref ProfileApiGateway
        LogUnitAccess:
          Type: Api
          Properties:
            Path: /units/{unitId}/access
            Method: post
            RestApiId: !Ref ProfileApiGateway

  RentalEventProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/rent  # Assuming the script is in this directory
      Handler: process_rental_events.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RentalsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref UnitBus
        - SQSPollerPolicy:
            QueueName: !Ref RentalEventsQueue
      Environment:
        Variables:
          RENTALS_TABLE: !Ref RentalsTable
          UNIT_BUS: !Ref UnitBus
          POWERTOOLS_SERVICE_NAME: rental-event-processor
          LOG_LEVEL: INFO
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RentalEventsQueue.Arn
            BatchSize: 10
            Enabled: true

  UnitBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "Address-${AWS::StackName}"

  ApiGatewayEventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      Path: !Join ["", ["/", !Ref "AWS::StackName", "/"]]
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowApiGatewayServiceToAssumeRole
            Effect: Allow
            Action:
              - 'sts:AssumeRole'
            Principal:
              Service:
                - apigateway.amazonaws.com
      Policies:
        - PolicyName: EBPutEvents
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'events:PutEvents'
                Resource:
                  - !GetAtt UnitBus.Arn
  
  ProfileApiGateway:
    Type: AWS::Serverless::Api
    DependsOn:
    - ApiGatewayEventBridgeRole

    Properties:
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: MyCognitoAuthorizer
        Authorizers:
          MyCognitoAuthorizer:
            UserPoolArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      MethodSettings:
        - LoggingLevel: INFO
          ResourcePath: '/*' # allows for logging on any resource
          HttpMethod: '*' # allows for logging on any method
      
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
              Location: api.yaml



  ListUserRentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref ListStorageUnitsFunction
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProfileApiGateway}/*/OPTIONS/units'

  CreateStorageUnitPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref CreateStorageUnitFunction
      Principal: "apigateway.amazonaws.com"
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProfileApiGateway}/*/OPTIONS/units'


  RentalEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-RentalEventsQueue"
      VisibilityTimeout: 30  # Should match Lambda function timeout

  RentalEventProcessorSQSPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref RentalEventProcessorFunction
      Principal: "sqs.amazonaws.com"
      SourceArn: !GetAtt RentalEventsQueue.Arn
Outputs:
  UnitBus:
    Description: "Rent Unit Event Bus Output"
    Value: !Ref UnitBus
  # UnitTable:
  #   Description: "DynamoDB User Unit Table"
  #   Value: !Ref UserUnitTable

  PaymentsTable:
    Description: "DynamoDB Payments Table"
    Value: !Ref PaymentsTable
  PaymentManagementFunction:
    Description: "Payment Management Lambda Function"
    Value: !Ref PaymentManagementFunction

  RentalEventsQueue:
    Description: "SQS Queue for Rental Events"
    Value: !Ref RentalEventsQueue

  AccessLogTable:
    Description: "DynamoDB Access Log Table"
    Value: !Ref AccessLogTable

  UnitAccessNotificationTopic:
    Description: "SNS Topic for Unit Access Notifications"
    Value: !Ref UnitAccessNotificationTopic

  ProfileApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ProfileApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"