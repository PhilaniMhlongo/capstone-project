AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Self-Storage Solution Serverless Backend Asynchronous Pattern with EventBridge
  and SQS
Parameters:
  UserPool:
    Type: String
    Description: User Pool
  Service:
    Type: String
    Default: userprofile
  Stage:
    Type: String
    Default: prod
Globals:
  Function:
    Timeout: 20
    Tracing: Active
    Layers:
    - Fn::Sub: arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPython:20
  Api:
    TracingEnabled: true
Resources:
  StorageUnitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-StorageUnitsTable
      AttributeDefinitions:
      - AttributeName: unit_id
        AttributeType: S
      KeySchema:
      - AttributeName: unit_id
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  RentalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-RentalsTable
      AttributeDefinitions:
      - AttributeName: rental_id
        AttributeType: S
      - AttributeName: unit_id
        AttributeType: S
      - AttributeName: user_id
        AttributeType: S
      KeySchema:
      - AttributeName: rental_id
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: UnitIndex
        KeySchema:
        - AttributeName: unit_id
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      - IndexName: UserIndex
        KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
  CreateStorageUnitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateStorageUnitFunction
      Handler: create_unit.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StorageUnitsTable
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
            Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
      Environment:
        Variables:
          STORAGE_UNITS_TABLE:
            Ref: StorageUnitsTable
          USER_POOL_ID:
            Ref: UserPool
    Metadata:
      SamResourceId: CreateStorageUnitFunction
  ListStorageUnitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ListStorageUnitsFunction
      Handler: list_units.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: StorageUnitsTable
      Environment:
        Variables:
          STORAGE_UNITS_TABLE:
            Ref: StorageUnitsTable
    Metadata:
      SamResourceId: ListStorageUnitsFunction
  BookStorageUnitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: BookStorageUnitFunction
      Handler: book_storage_unit.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StorageUnitsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RentalsTable
      Environment:
        Variables:
          STORAGE_UNITS_TABLE:
            Ref: StorageUnitsTable
          RENTALS_TABLE:
            Ref: RentalsTable
      Events:
        Trigger:
          Type: EventBridgeRule
          Properties:
            EventBusName:
              Ref: UnitBus
            Pattern:
              source:
              - rentals-service
              detail-type:
              - storage.unit.booked
    Metadata:
      SamResourceId: BookStorageUnitFunction
  AccessLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-AccessLogTable
      AttributeDefinitions:
      - AttributeName: unit_id
        AttributeType: S
      - AttributeName: timestamp
        AttributeType: S
      KeySchema:
      - AttributeName: unit_id
        KeyType: HASH
      - AttributeName: timestamp
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
  UnitAccessNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${AWS::StackName}-UnitAccessNotifications
  ManageStorageUnitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ManageStorageUnitFunction
      Handler: manage_storage_unit.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: StorageUnitsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RentalsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AccessLogTable
      - Statement:
        - Effect: Allow
          Action:
          - sns:Publish
          Resource:
            Ref: UnitAccessNotificationTopic
      Environment:
        Variables:
          STORAGE_UNITS_TABLE:
            Ref: StorageUnitsTable
          RENTALS_TABLE:
            Ref: RentalsTable
          ACCESS_LOG_TABLE:
            Ref: AccessLogTable
          UNIT_ACCESS_NOTIFICATION_TOPIC:
            Ref: UnitAccessNotificationTopic
      Events:
        UpdateUnitStatus:
          Type: Api
          Properties:
            Path: /units/{unitId}/status
            Method: put
            RestApiId:
              Ref: ProfileApiGateway
        ShareUnitAccess:
          Type: Api
          Properties:
            Path: /units/{unitId}/share
            Method: post
            RestApiId:
              Ref: ProfileApiGateway
        LogUnitAccess:
          Type: Api
          Properties:
            Path: /units/{unitId}/access
            Method: post
            RestApiId:
              Ref: ProfileApiGateway
    Metadata:
      SamResourceId: ManageStorageUnitFunction
  UserUnitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-UnitTable
      AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      - AttributeName: unit_id
        AttributeType: S
      KeySchema:
      - AttributeName: user_id
        KeyType: HASH
      - AttributeName: unit_id
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
  AddUserRentUnitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AddUserRentUnitFunction
      Handler: createRental.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserUnitTable
      Environment:
        Variables:
          TABLE_NAME:
            Ref: UserUnitTable
      Events:
        Trigger:
          Type: EventBridgeRule
          Properties:
            EventBusName:
              Ref: UnitBus
            Pattern:
              source:
              - rentals-service
              detail-type:
              - rental.created
    Metadata:
      SamResourceId: AddUserRentUnitFunction
  EditUserRentalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: EditUserRentalFunction
      Handler: editStatus.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserUnitTable
      Environment:
        Variables:
          TABLE_NAME:
            Ref: UserUnitTable
      Events:
        Trigger:
          Type: EventBridgeRule
          Properties:
            EventBusName:
              Ref: UnitBus
            Pattern:
              source:
              - rentals-service
              detail-type:
              - rental.status.updated
    Metadata:
      SamResourceId: EditUserRentalFunction
  CancelUserRentalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CancelUserRentalFunction
      Handler: cancelRental.lambda_handler
      Runtime: python3.9
      Tracing: Active
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserUnitTable
      Environment:
        Variables:
          TABLE_NAME:
            Ref: UserUnitTable
      Events:
        Trigger:
          Type: EventBridgeRule
          Properties:
            EventBusName:
              Ref: UnitBus
            Pattern:
              source:
              - rentals-service
              detail-type:
              - rental.canceled
    Metadata:
      SamResourceId: CancelUserRentalFunction
  UnitBus:
    Type: AWS::Events::EventBus
    Properties:
      Name:
        Fn::Sub: Address-${AWS::StackName}
  ApiGatewayEventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      Path:
        Fn::Join:
        - ''
        - - /
          - Ref: AWS::StackName
          - /
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowApiGatewayServiceToAssumeRole
          Effect: Allow
          Action:
          - sts:AssumeRole
          Principal:
            Service:
            - apigateway.amazonaws.com
      Policies:
      - PolicyName: EBPutEvents
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource:
            - Fn::GetAtt:
              - UnitBus
              - Arn
  ProfileApiGateway:
    Type: AWS::Serverless::Api
    DependsOn:
    - ApiGatewayEventBridgeRole
    Properties:
      StageName:
        Ref: Stage
      Auth:
        DefaultAuthorizer: MyCognitoAuthorizer
        Authorizers:
          MyCognitoAuthorizer:
            UserPoolArn:
              Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      MethodSettings:
      - LoggingLevel: INFO
        ResourcePath: /*
        HttpMethod: '*'
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ../../api.yaml
  ListUserRentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ListUserRentFunction
      Handler: listRental.lambda_handler
      Runtime: python3.9
      Policies:
        DynamoDBReadPolicy:
          TableName:
            Ref: UserUnitTable
      Environment:
        Variables:
          TABLE_NAME:
            Ref: UserUnitTable
    Metadata:
      SamResourceId: ListUserRentFunction
  ListUserRentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ListUserRentFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProfileApiGateway}/*/GET/rentals
  CreateStorageUnitPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: CreateStorageUnitFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProfileApiGateway}/*/POST/units
Outputs:
  UnitBus:
    Description: Rent Unit Event Bus Output
    Value:
      Ref: UnitBus
  UnitTable:
    Description: DynamoDB User Unit Table
    Value:
      Ref: UserUnitTable
  AccessLogTable:
    Description: DynamoDB Access Log Table
    Value:
      Ref: AccessLogTable
  UnitAccessNotificationTopic:
    Description: SNS Topic for Unit Access Notifications
    Value:
      Ref: UnitAccessNotificationTopic
  ProfileApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ProfileApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/
